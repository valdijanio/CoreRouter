# Disk layout of the image (G1.6a). Fixed GUIDs and volume ids keep the
# image reproducible; rootfs-a's PARTUUID is the one in linux.fragment's
# CONFIG_CMDLINE (checked by xtask). rootfs-b stays empty until the A/B
# update (G1.6b), so the layout never has to change on a field upgrade.
image efi.vfat {
	vfat {
		extraargs = "-i 0CC61FA8 -n COREROUTER --invariant"
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 32M
}

image config.ext4 {
	ext4 {
		label = "config"
		use-mke2fs = true
		features = "^metadata_csum_seed"
		extraargs = "-U deabc1c0-d07d-44bc-a86d-7475176d1214 -E hash_seed=deabc1c0-d07d-44bc-a86d-7475176d1214"
	}
	empty = true
	temporary = true
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "39dfcaa2-2c8a-4912-acaa-6af0c68b5350"
	}

	partition efi {
		image = "efi.vfat"
		partition-type-uuid = U
		partition-uuid = "4f9a520b-35f7-4633-a4bb-e9f871d1473c"
		offset = 1M
		bootable = true
	}

	partition rootfs-a {
		image = "rootfs.squashfs"
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = "3e1088b8-5b4b-4fbb-b756-a271f641d018"
		size = 256M
	}

	partition rootfs-b {
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = "868e1d1d-85bb-4c62-a083-f61aa7a5cda2"
		size = 256M
	}

	partition config {
		image = "config.ext4"
		partition-type-uuid = L
		partition-uuid = "4c6422db-190c-4f35-b930-a98862b6be7d"
	}
}
