# Disk layout of the image (G1.6a, A/B since G1.6b). Fixed GUIDs and volume
# ids keep the image reproducible; rootfs-a's PARTUUID is the one in
# linux.fragment's CONFIG_CMDLINE (checked by xtask). Each rootfs partition
# holds a squashfs and its dm-verity tree (`corerouter-image seal`); rootfs-b
# stays empty until the first update writes it. The ESP holds both slots'
# kernels (slot A's is the removable-media path BOOTX64.EFI) and their
# signed headers: 128 MiB for two ~20 MiB kernels and room to grow.
# config.ext4 is kept: the installer ISO carries it (G1.6c).
image efi.vfat {
	vfat {
		extraargs = "-i 0CC61FA8 -n COREROUTER --invariant"
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 128M
}

# 4 KiB blocks (one block group: no backup superblocks spread over the
# partition, mke2fs uses 1 KiB for a 64 MiB filesystem) and the journal at
# 1 MiB, not in the middle: everything
# the empty filesystem holds is then in its first 5 MiB, which is what the
# installer ISO carries (the installer zeroes the rest, G1.6c).
image config.ext4 {
	ext4 {
		label = "config"
		use-mke2fs = true
		features = "^metadata_csum_seed"
		extraargs = "-U deabc1c0-d07d-44bc-a86d-7475176d1214 -E hash_seed=deabc1c0-d07d-44bc-a86d-7475176d1214 -b 4096 -J size=4,location=1M"
	}
	empty = true
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "39dfcaa2-2c8a-4912-acaa-6af0c68b5350"
	}

	partition efi {
		image = "efi.vfat"
		partition-type-uuid = U
		partition-uuid = "4f9a520b-35f7-4633-a4bb-e9f871d1473c"
		offset = 1M
		bootable = true
	}

	partition rootfs-a {
		image = "rootfs.img"
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = "3e1088b8-5b4b-4fbb-b756-a271f641d018"
		size = 256M
	}

	partition rootfs-b {
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = "868e1d1d-85bb-4c62-a083-f61aa7a5cda2"
		size = 256M
	}

	partition config {
		image = "config.ext4"
		partition-type-uuid = L
		partition-uuid = "4c6422db-190c-4f35-b930-a98862b6be7d"
	}
}

# G1.6c: the installer's boot image — a FAT filesystem with the installer
# kernel as the removable-media path. It is both the El Torito image of the
# ISO and its GPT's EFI System partition (`corerouter-image installer`);
# El Torito counts it in 16-bit 512-byte sectors, so it stays under 32 MiB.
image efiboot.vfat {
	vfat {
		extraargs = "-i 0CC61FA9 -n CRINSTALL --invariant"
		file EFI {
			image = "installer/EFI"
		}
	}
	size = 30M
}
