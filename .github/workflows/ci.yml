# G0.2 — o mesmo portão que os agentes rodam antes de cada commit (`cargo xtask ci`),
# mais um build da GUI/CLI/daemon em macOS e Windows.
# A toolchain vem de rust-toolchain.toml (stable + rustfmt, clippy, wasm32-unknown-unknown).
# Actions fixadas por SHA; o comentário diz a versão.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # bench/**: base descartável da bateria de testes da fila de entrada (PRs sintéticos que
    # nunca vão para a main).
    branches: [main, "bench/**"]
  # Rodar à mão numa branch (Actions → ci → Run workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Sem debuginfo no CI: target e cache bem menores (o cache passava de 2,5 GB e levava ~70 s
  # para restaurar) e link mais rápido. A mensagem de panic continua com arquivo e linha.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  xtask-ci:
    name: xtask ci (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # G1.14: o teste de VRF em netns falha em vez de pular (e o passo netns
      # do xtask também) se o módulo `vrf` não estiver carregado.
      COREROUTER_REQUIRE_VRF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cabeçalhos que eframe/winit/wgpu (x11, wayland, GL) pedem para compilar, e o nftables dos
      # testes em namespace. Em cache: o `apt-get update` variava de 14 s a 114 s conforme o espelho.
      - name: Dependências de sistema
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
            libgl1-mesa-dev nftables
          version: "1"

      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
          # Sem o alvo, o passo wasm do xtask vira "skip" em vez de falhar.
          rustup target list --installed | grep -qx wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # O `cargo xtask ci` usa o nextest quando existe: os binários de teste rodam em paralelo.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest

      # G1.2: `cargo xtask netns` testa o hal-linux num network namespace sem root.
      # O Ubuntu 24.04 bloqueia user namespaces sem privilégio (AppArmor); isto só
      # muda a VM descartável do runner. Se não pegar, o passo netns vira "skip".
      - name: Liberar user namespaces sem root
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # G1.14: um user namespace não carrega módulos; carregamos o `vrf` aqui, na
      # VM descartável do runner (o sudo dos agentes, localmente, continua proibido).
      # Imagens do Azure às vezes trazem o vrf.ko só em linux-modules-extra. Instalar o pacote
      # levava ~7 min (gatilhos do initramfs); baixar e tirar só o vrf.ko leva segundos.
      - name: Carregar o módulo vrf
        run: |
          if ! sudo modprobe vrf; then
            pkg="linux-modules-extra-$(uname -r)"
            cd "$RUNNER_TEMP"
            sudo apt-get update -qq   # o cache de pacotes acima pula o update
            apt-get download "$pkg"
            dpkg-deb --fsys-tarfile "$pkg"_*.deb | tar -x --wildcards '*/vrf.ko*'
            ko=$(find . -name 'vrf.ko*' -print -quit)
            if ! sudo insmod "$ko"; then
              sudo apt-get install -y --no-install-recommends "$pkg"
              sudo modprobe vrf
            fi
          fi
          lsmod | grep -w '^vrf'

      - name: cargo xtask ci
        run: cargo xtask ci

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # hal-linux compila vazio fora do Linux; o daemon cai no backend virtual.
      - name: cargo build
        run: cargo build -p corerouter-gui -p corerouter-cli -p corerouter-daemon
