# G0.2 — o mesmo portão que os agentes rodam antes de cada commit (`cargo xtask ci`),
# mais um build da GUI/CLI/daemon em macOS e Windows.
# A toolchain vem de rust-toolchain.toml (stable + rustfmt, clippy, wasm32-unknown-unknown).
# Actions fixadas por SHA; o comentário diz a versão.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  xtask-ci:
    name: xtask ci (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # G1.14: o teste de VRF em netns falha em vez de pular (e o passo netns
      # do xtask também) se o módulo `vrf` não estiver carregado.
      COREROUTER_REQUIRE_VRF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cabeçalhos que eframe/winit/wgpu (x11, wayland, GL) pedem para compilar.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev nftables

      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
          # Sem o alvo, o passo wasm do xtask vira "skip" em vez de falhar.
          rustup target list --installed | grep -qx wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # G1.2: `cargo xtask netns` testa o hal-linux num network namespace sem root.
      # O Ubuntu 24.04 bloqueia user namespaces sem privilégio (AppArmor); isto só
      # muda a VM descartável do runner. Se não pegar, o passo netns vira "skip".
      - name: Liberar user namespaces sem root
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # G1.14: um user namespace não carrega módulos; carregamos o `vrf` aqui, na
      # VM descartável do runner (o sudo dos agentes, localmente, continua proibido).
      # Imagens do Azure às vezes trazem o vrf.ko só em linux-modules-extra.
      - name: Carregar o módulo vrf
        run: |
          if ! sudo modprobe vrf; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe vrf
          fi
          lsmod | grep -w '^vrf'

      - name: cargo xtask ci
        run: cargo xtask ci

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # hal-linux compila vazio fora do Linux; o daemon cai no backend virtual.
      - name: cargo build
        run: cargo build -p corerouter-gui -p corerouter-cli -p corerouter-daemon
