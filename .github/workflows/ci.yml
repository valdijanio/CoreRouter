# G0.2 — o mesmo portão que os agentes rodam antes de cada commit (`cargo xtask ci`),
# mais um build da GUI/CLI/daemon em macOS e Windows.
# A toolchain vem de rust-toolchain.toml (stable + rustfmt, clippy, wasm32-unknown-unknown).
# Actions fixadas por SHA; o comentário diz a versão.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # bench/**: base descartável da bateria de testes da fila de entrada (PRs sintéticos que
    # nunca vão para a main).
    branches: [main, "bench/**"]
  # Rodar à mão numa branch (Actions → ci → Run workflow). A fila de entrada (scripts/land.sh)
  # dispara assim o lote, em `queue/*`, e escolhe o runner: `corerouter` (o runner próprio,
  # docs/ci-runner.md) quando o GitHub o mostra online, senão `github`.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner dos jobs pesados: github ou corerouter (só vale em queue/*)"
        type: choice
        options: [github, corerouter]
        default: github

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Sem debuginfo no CI: target e cache bem menores (o cache passava de 2,5 GB e levava ~70 s
  # para restaurar) e link mais rápido. A mensagem de panic continua com arquivo e linha.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # PR que só mexe em `docs/` (o fold da fila de entrada, por exemplo) não pode quebrar o código:
  # os 3 checks exigidos passam com `cargo xtask docs` só (~20 s em vez de ~3 min). O mesmo
  # para um push na main só de docs. Lote (workflow_dispatch) roda sempre o completo.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      runs_on: ${{ steps.runner.outputs.runs_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # PR: contra a base; push na main: contra o commit anterior (o fold de cada lote só
          # mexe em docs/). workflow_dispatch (lote da fila): sempre o completo.
          docs_only=false
          case "${{ github.event_name }}" in
            pull_request | push)
              if git cat-file -e "$BASE" 2>/dev/null &&
                ! git diff --name-only "$BASE"...HEAD | grep -qv '^docs/'; then
                docs_only=true
              fi ;;
          esac
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "só documentação: $docs_only"
      # Onde rodam `test`, `bench-check` e `netns` (docs/ci-runner.md). O runner próprio só recebe
      # código confiável: o lote da fila (workflow_dispatch em queue/*, pedido pela fila) e, se a
      # variável do repositório CI_RUNNER for `corerouter`, o push na main. PR (inclusive de fork)
      # nunca: fica nos runners do GitHub. O hook do runner recusa o resto mesmo que um workflow
      # alterado peça `self-hosted`; isto aqui só escolhe.
      - id: runner
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WANT: ${{ inputs.runner }}
          MAIN_RUNNER: ${{ vars.CI_RUNNER }}
        run: |
          own=false
          case "$EVENT:$REF" in
            workflow_dispatch:refs/heads/queue/*) if [ "$WANT" = corerouter ]; then own=true; fi ;;
            push:refs/heads/main) if [ "$MAIN_RUNNER" = corerouter ]; then own=true; fi ;;
          esac
          if [ "$own" = true ]; then
            echo 'runs_on=["self-hosted","corerouter"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runs_on="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          fi
          echo "runner próprio: $own"

  # O portão completo em jobs paralelos (processo, 2026-10-26): um job serial levava 21 min no
  # lote, 10 deles no bench-check. Cada job roda um grupo de passos do `cargo xtask ci --only`
  # e tem o próprio cache. O PR (`--fast`) roda só `lint` e `test`; `bench-check`, `netns` e
  # `xdp-root` rodam no lote da fila (workflow_dispatch) e na main. O check exigido pela
  # proteção da main continua sendo `xtask ci (linux)`: o job final que confere todos.
  lint:
    name: lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          apt: ${{ env.DOCS_ONLY != 'true' }}
          cache: ${{ env.DOCS_ONLY != 'true' }}
      - name: cargo xtask ci (fmt, clippy, docs, ebpf-check, layers, agents-sync, wasm)
        if: env.DOCS_ONLY != 'true'
        run: cargo xtask ci --only fmt,clippy,docs,ebpf-check,layers,agents-sync,wasm
      - name: cargo xtask docs (só documentação)
        if: env.DOCS_ONLY == 'true'
        run: cargo xtask docs

  # Os testes em partes, cada uma num runner de 4 vCPU (o nextest usa todos os núcleos de cada
  # um): `COREROUTER_CI_PARTITION=i/n` vira `--partition hash:i/n`. Cada parte compila o
  # workspace do próprio cache (~1,5 min); mais partes que isso só somam compilação.
  test:
    name: test (${{ matrix.part }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runs_on) }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      COREROUTER_CI_PARTITION: ${{ matrix.part }}/${{ strategy.job-total }}
      # G0.30: no PR, a camada rápida (sem os testes `slow_…`, proptest com 32 casos); no lote da
      # fila (workflow_dispatch) e na main, todos os testes com os casos de cada um.
      COREROUTER_TEST_LAYER: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
      # G0.30: teste da camada rápida acima disto reprova o PR. O dobro do teto local (5 s): no
      # runner de 4 vCPU um teste que gasta CPU leva 1,5–2× o tempo da máquina das sessões
      # (medido no #389: 18 testes acima de 5 s aqui contra 4 lá).
      COREROUTER_TEST_CEILING_SECS: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          nextest: "true"
      - run: cargo xtask ci --only test

  bench-check:
    name: bench-check
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.changes.outputs.runs_on) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: cargo xtask ci --only bench-check

  # Portão em duas camadas: no PR, `cargo xtask ci --fast` (determinístico, sem os testes
  # contra o kernel); no lote da fila de entrada (workflow_dispatch) e na main, o completo.
  # Teste que falha e passa ao repetir é marcado como instável e não reprova (docs/perf.md).
  netns:
    name: netns
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.changes.outputs.runs_on) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          kernel: "true"
      - run: cargo xtask ci --only netns

  # G2.5: o objeto XDP carregado de verdade, como root (o veth de ci/kernel-modules liga o
  # COREROUTER_REQUIRE_XDP).
  # Os testes de root medem vazão e precisão: um por vez em cada runner, as partes em runners
  # diferentes (`COREROUTER_CI_PARTITION`, divididas pelo tempo medido de cada teste).
  # Fica no GitHub mesmo com o runner próprio (docs/ci-runner.md): precisa de root para rodar o
  # código do job, e lá dentro o `runner` não tem sudo; e mede vazão, que a VM dividida com os
  # outros jobs distorceria.
  xdp-root:
    name: xdp-root (${{ matrix.part }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      COREROUTER_CI_PARTITION: ${{ matrix.part }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          kernel: "true"
      - run: cargo xtask ci --only xdp-root

  # O check exigido pela proteção da main. `if: always()`: um job pulado conta como verde na
  # proteção, então este roda sempre e falha se algum job falhou ou foi cancelado. Pulado só
  # vale para quem pula de propósito (PR e só documentação).
  xtask-ci:
    name: xtask ci (linux)
    needs: [changes, lint, test, bench-check, netns, xdp-root]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado dos jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | tee results
          bad=0
          while read -r job result; do
            case "$job:$result" in
              *:success) ;;
              test:skipped) [ "$DOCS_ONLY" = true ] || bad=1 ;;
              bench-check:skipped | netns:skipped | xdp-root:skipped)
                [ "$DOCS_ONLY" = true ] || [ "$EVENT" = pull_request ] || bad=1 ;;
              *) bad=1 ;;
            esac
            [ "$bad" = 0 ] || { echo "::error::job $job: $result"; exit 1; }
          done < results

  build:
    name: build (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install --no-self-update
          rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.docs_only != 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # hal-linux compila vazio fora do Linux; o daemon cai no backend virtual.
      - name: cargo build
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo build -p corerouter-gui -p corerouter-cli -p corerouter-daemon
