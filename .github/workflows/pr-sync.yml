# Traz a main para os PRs com auto-merge que ficaram CONFLICTING (AGENTS.md, "Integração").
#
# O GitHub ignora o `merge=union` do .gitattributes, então um PR vira CONFLICTING sempre que outro
# acrescenta ao docs/log.md ou ao docs/gaps-history.md, e o auto-merge para até alguém trazer a
# main à mão. A cada push na main, `scripts/pr-sync.sh` faz o merge de verdade (com o union) nesses
# PRs: limpo → push e aprova o `ci` do PR; conflito real → comentário + rótulo `conflito`.

name: pr-sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Aprovar o run do `ci` que o push do bot deixa em "Action required" (e o `workflow_dispatch`
  # de reserva).
  actions: write

concurrency:
  group: pr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Identidade dos commits de merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Trazer a main para os PRs em conflito
        run: scripts/pr-sync.sh
