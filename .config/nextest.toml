# cargo-nextest (o passo `test` do `cargo xtask ci`).
#
# processo: os testes mais longos começam primeiro. Começando por último, um teste de 97 s
# segurava sozinho o fim da parte dele no CI (`--partition`, 2026-10-26: uma parte em 174 s, a
# outra em 55 s). Entram aqui os da camada lenta (`slow_…`, G0.30) e os que levam mais de ~30 s
# no runner do CI (linha SLOW do resumo). O nome casa com ou sem o módulo do arquivo
# (`tests/it/<arquivo>.rs`, G0.29).
[[profile.default.overrides]]
filter = """
test(/(^|::)slow_/)
| test(/(^|::)server_survives_mutated_conversations$/)
"""
priority = 100

# G0.30: o tempo de cada teste, em `target/nextest/default/junit.xml`; o `cargo xtask ci` lê e
# imprime os 20 mais lentos no fim (xtask/src/slowest.rs).
[profile.default.junit]
path = "junit.xml"

# G0.30: a camada rápida (o portão da sessão, `cargo xtask ci --affected`, e o do PR, `--fast`):
# tudo menos os testes cujo nome começa com `slow_` (o nome da função ou de um módulo). Eles
# são lentos de propósito (escala de 100 mil sessões, fuzz longo, esperas reais que não dá
# para simular) e rodam no lote da fila de entrada, na main e no CI noturno (perfil `default`).
# Teste novo acima de 1 s na camada rápida: simule o relógio ou dê o nome `slow_…`, com o
# motivo num comentário (CLAUDE.md, "Orçamento de testes").
[profile.quick]
default-filter = "not test(/(^|::)slow_/)"
