[package]
name = "corerouter-proto-dns"
description = "L2: DNS over hickory-proto: the router's resolver (TTL cache, server failover, serve-stale) and the LAN forwarder's chain of stages (no sockets: the caller brings the transport)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
corerouter-model.workspace = true
# Messages only: no async runtime, no resolver of its own (the daemon is
# threads, docs/architecture.md "DNS").
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
thiserror.workspace = true
ipnet.workspace = true
# `/ip dns static` regexp: linear time, no backtracking (hostile patterns
# cannot stall the forwarder).
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "resolver"
harness = false

[[bench]]
name = "forwarder"
harness = false

[lints]
workspace = true
