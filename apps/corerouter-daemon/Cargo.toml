[package]
name = "corerouter-daemon"
description = "L6: router daemon — owns the Session and the platform backend, serves the control channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
corerouter-engine.workspace = true
corerouter-hal.workspace = true
corerouter-hal-linux.workspace = true
corerouter-control.workspace = true
corerouter-storage-fs.workspace = true
corerouter-discovery.workspace = true
corerouter-model.workspace = true
corerouter-proto-lldp.workspace = true
corerouter-proto-mndp.workspace = true
# Signs zones (G4.1c-2): ring stays out of the engine and the GUI.
corerouter-proto-dns = { workspace = true, features = ["dnssec"] }
corerouter-proto-ntp.workspace = true
# Tools › Bandwidth Test (G6.4b): the iperf3 protocol; socket2 for the UDP
# stream sockets that share the server port (SO_REUSEADDR/SO_REUSEPORT).
corerouter-proto-iperf.workspace = true
socket2 = { version = "0.6.5", features = ["all"] }
corerouter-proto-syslog.workspace = true
corerouter-proto-flow.workspace = true
# service/radius.rs (G4.3j): the AAA service drives the RADIUS client.
corerouter-proto-radius.workspace = true
log.workspace = true
env_logger.workspace = true
signal-hook.workspace = true
serde_json.workspace = true
# service/https.rs: adlist downloads (G4.1d) without a system resolver or CA
# store: the router's resolver and the Mozilla roots compiled in.
rustls.workspace = true
webpki-roots = "1.0.10"
httparse = "1.10.1"
# service/analytics_queue.rs (G4.4f): gzip of the INSERT bodies, pure Rust
# (miniz_oxide), no C library.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# ip.dns.resolve (G4.1d): record types by name.
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# service/dns_server.rs: IP_PKTINFO / IPV6_RECVPKTINFO (answer from the
# address the query went to), which std and socket2 lack.
nix = { version = "0.30.1", default-features = false, features = ["socket", "uio", "net"] }

[dev-dependencies]
serde_json.workspace = true
# service/https.rs: a local TLS server with a self-signed certificate.
rcgen.workspace = true
# benches/radius_aaa.rs (G4.3j).
criterion.workspace = true
# netns_dns.rs: a test DNS server (service/dns.rs uses it as a normal
# dependency too).
# netns_dhcp.rs: a DHCP server thread inside another network namespace.
corerouter-proto-dhcp.workspace = true
nix = { version = "0.30.1", default-features = false, features = ["sched", "net"] }

[[bench]]
name = "radius_aaa"
harness = false

[lints]
workspace = true
