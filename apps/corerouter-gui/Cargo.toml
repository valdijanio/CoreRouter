[package]
name = "corerouter-gui"
description = "L6: graphical app (WinBox replacement natively, WebFig replacement on WASM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
corerouter-engine.workspace = true
corerouter-ui.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
log.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
corerouter-control.workspace = true
corerouter-discovery.workspace = true
eframe = { workspace = true, features = ["wayland", "x11", "clipboard"] }
env_logger.workspace = true
png.workspace = true
base64.workspace = true
keyring.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "CloseEvent",
    "Event",
    "Location",
    "MessageEvent",
    "Storage",
    "UrlSearchParams",
    "WebSocket",
    "Window",
] }

[lints]
workspace = true
