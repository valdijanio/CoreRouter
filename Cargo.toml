[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/valdijanio/CoreRouter"

[workspace.dependencies]
# Workspace crates (path deps; the layer table lives in xtask/src/layers.rs).
corerouter-model = { path = "crates/model" }
corerouter-buildinfo = { path = "crates/buildinfo" }
corerouter-cgnat-map = { path = "crates/cgnat-map" }
corerouter-hal = { path = "crates/hal" }
corerouter-hal-linux = { path = "crates/hal-linux" }
corerouter-firewall = { path = "crates/firewall" }
corerouter-proto-bgp = { path = "crates/proto-bgp" }
corerouter-proto-ospf = { path = "crates/proto-ospf" }
corerouter-proto-mpls = { path = "crates/proto-mpls" }
corerouter-proto-cgnat = { path = "crates/proto-cgnat" }
corerouter-proto-dns = { path = "crates/proto-dns" }
corerouter-proto-dhcp = { path = "crates/proto-dhcp" }
corerouter-proto-discovery = { path = "crates/proto-discovery" }
corerouter-proto-lldp = { path = "crates/proto-lldp" }
corerouter-proto-mndp = { path = "crates/proto-mndp" }
corerouter-proto-ntp = { path = "crates/proto-ntp" }
corerouter-proto-syslog = { path = "crates/proto-syslog" }
corerouter-proto-flow = { path = "crates/proto-flow" }
corerouter-engine = { path = "crates/engine" }
corerouter-control = { path = "crates/control" }
corerouter-mcp = { path = "crates/mcp" }
corerouter-storage-fs = { path = "crates/storage-fs" }
corerouter-discovery = { path = "crates/discovery" }
corerouter-ui = { path = "crates/ui" }
corerouter-shell = { path = "crates/shell" }

# External: heavy crates enter with default-features = false.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.34"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
ipnet = { version = "2.12.2", features = ["serde"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37.0", default-features = false }
# Tools > Ping / MTR charts (0.38 is the egui 0.37 line).
egui_plot = { version = "0.38.0", default-features = false }
png = "0.18.1"
base64 = "0.23.1"
proptest = "1.12.0"
# G0.9: benchmarks (dev-dependency only; no plots, no rayon: a summary comes from xtask).
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Synchronous WebSocket (daemon server for the web GUI); no async runtime.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# SIGINT/SIGTERM for the daemon's graceful shutdown: `flag::register` (safe API, unix and
# Windows; the iterator is unix-only).
signal-hook = { version = "0.3.18", default-features = false }
# Line editor of `corerouter-cli shell` (history file, completion, colors, key handlers).
rustyline = { version = "19.0.0", default-features = false, features = ["custom-bindings", "with-file-history"] }
# G0.3: password hashes (Argon2id, pure Rust; salt from the OS, not from `rand`).
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "0.3.4"
# G0.3: TLS without OpenSSL; `ring` as the crypto provider (no cmake/NASM on Windows CI).
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14.0", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17.14"
# G0.3: password prompt without echo (CLI).
rpassword = "7.4.0"
# G0.3: "Remember password" in the OS store (Keychain, Credential Manager, Secret
# Service over zbus: pure Rust, no libdbus headers on CI).
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# Argon2 unoptimized takes ~1 s per hash: tests would crawl.
# Pastas de build menores e builds mais rápidas: cada sessão em paralelo tem a sua
# (`CARGO_TARGET_DIR`), e com debuginfo completo uma `cargo xtask ci` do zero ocupava 15 GB
# (163 s); assim, 6,6 GB (135 s), **medido** (docs/perf.md). Backtraces e panics continuam com
# arquivo e linha do nosso código; as dependências ficam sem debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
# Must stay "unwind": engine::guard relies on catch_unwind to roll back a command.
panic = "unwind"
lto = "thin"
codegen-units = 1
